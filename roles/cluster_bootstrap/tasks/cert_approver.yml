---
- name: Resolve latest kubelet-serving-cert-approver version from Gitea mirror
  ansible.builtin.uri:
    url: "{{ mirror_api_base }}/{{ gitea_mirror_org }}/kubelet-serving-cert-approver/tags?limit=100"
    return_content: true
  register: _cert_approver_tags
  delegate_to: localhost
  become: false
  retries: 8
  delay: 15
  until: _cert_approver_tags.status == 200

- name: Set cert-approver version fact
  ansible.builtin.set_fact:
    cert_approver_version: >-
      {{ _cert_approver_tags.json | map(attribute='name')
         | select('match', '^v\d+\.\d+\.\d+$')
         | community.general.version_sort | last }}

- name: Install kubelet-serving-cert-approver
  ansible.builtin.command:
    cmd: kubectl apply -f {{ mirror_raw_base }}/kubelet-serving-cert-approver/raw/tag/{{ cert_approver_version }}/deploy/standalone-install.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: cert_approver_output
  changed_when: true

- name: Print kubelet-serving-cert-approver install output
  ansible.builtin.debug:
    var: cert_approver_output.stdout_lines

- name: Wait for kubelet-serving-cert-approver to be ready
  ansible.builtin.command:
    cmd: >
      kubectl wait --for=condition=Available deployment/kubelet-serving-cert-approver
      --namespace kubelet-serving-cert-approver
      --timeout=120s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Apply kubelet-serving-cert-approver default-deny NetworkPolicy
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: kubelet-serving-cert-approver
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: true
