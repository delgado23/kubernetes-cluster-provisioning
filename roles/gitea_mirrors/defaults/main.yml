---
# roles/gitea_mirrors
# Upstream GitHub repos pull-mirrored into the local Gitea github-mirror org.
#
# Two consumers:
#   * the Kubernetes cluster build — every repo it reads from GitHub (for a
#     version, a manifest, or a binary) must appear here, or an unauthenticated
#     GitHub 60 req/hr throttle can abort a build;
#   * pantheon-of-order (AzerothCore WotLK) — mirrored for preservation, so the
#     realm stays rebuildable if an upstream is deleted, renamed or force-pushed.
#
# Add a line to mirror a new dependency. `name:` is optional and renames the
# repo on the Gitea side only (used where two upstreams share a repo name).

gitea_mirror_repos:
  # --- Kubernetes cluster build dependencies ---
  - {owner: flannel-io,         repo: flannel}
  - {owner: longhorn,           repo: longhorn}
  - {owner: traefik,            repo: traefik-helm-chart}
  - {owner: cert-manager,       repo: cert-manager}
  - {owner: kubernetes-sigs,    repo: headlamp}
  - {owner: emberstack,         repo: kubernetes-reflector}
  - {owner: argoproj,           repo: argo-helm}
  - {owner: kubernetes-sigs,    repo: descheduler}
  - {owner: prometheus-community, repo: helm-charts}
  - {owner: cloudnativelabs,    repo: kube-router}
  - {owner: metallb,            repo: metallb}
  - {owner: kubernetes-sigs,    repo: metrics-server}
  - {owner: alex1989hu,         repo: kubelet-serving-cert-approver}
  - {owner: derailed,           repo: k9s}

  # --- pantheon-of-order (AzerothCore WotLK) upstreams ---
  # The core is the mod-playerbots fork on its `Playerbot` branch, NOT vanilla
  # AzerothCore; it is renamed here so both can be mirrored without colliding.
  - {owner: mod-playerbots,     repo: azerothcore-wotlk, name: azerothcore-wotlk-playerbots}
  - {owner: mod-playerbots,     repo: mod-playerbots}
  - {owner: azerothcore,        repo: mod-ah-bot}
  - {owner: azerothcore,        repo: mod-autobalance}
  - {owner: DustinHendrickson,  repo: mod-player-bot-level-brackets}
  - {owner: DustinHendrickson,  repo: mod-ollama-chat}
  - {owner: heyitsbench,        repo: mod-arac}
  - {owner: PMZFX,              repo: mod-homebrew-nourishment}
  - {owner: PMZFX,              repo: mod-homebrew-vendors}
  - {owner: jrad7,              repo: mod-dungeon-clear}
  - {owner: azerothcore,        repo: azerothcore-wotlk}
  # ~3 GB. client-data's master tree is only LICENSE + README, but the bulk of
  # the client data lives in non-master refs, which a --mirror clone fetches.
  # Note that this still does NOT cover the Data.zip release assets, which are
  # preserved separately via gitea_mirror_assets below.
  - {owner: wowgaming,          repo: client-data}

# How often Gitea re-pulls each mirror from upstream GitHub.
gitea_mirror_interval: "24h"

# Force an immediate sync of each mirror right after (re-)ensuring it exists.
gitea_mirror_sync_now: true

# Gitea's migrate API clones synchronously, so the HTTP call stays open for the
# whole clone. The AzerothCore repos are ~1.3 GB each and exceed the old
# hardcoded 600s on a slow link. If this does time out client-side Gitea
# usually still finishes in the background, so re-running converges.
gitea_mirror_migrate_timeout: 3600

# Where release assets are staged before being republished to Gitea. Must be on
# real disk with room for the largest asset: Data.zip is ~1.11 GiB and /tmp on
# the workstation is a 2 GB tmpfs (i.e. RAM), which it would nearly fill.
gitea_mirror_asset_tmp: /var/tmp/gitea-mirror

# Release *assets* are not mirrored by Gitea (only git data + tags). These few
# files exist only as GitHub release downloads, so we resolve the latest stable
# tag, fetch the asset from GitHub here (server-side, out of the cluster-build
# hot path) and republish to the Gitea generic package registry, which the build
# then reads anonymously. `match`/`strip` mirror the tag-selection in
# cluster_addons/tasks/fetch_versions.yml.
#
# `version:` is optional and pins a spec to one release instead of resolving the
# latest matching tag. Use it when the artifact is being preserved rather than
# tracked, or when upstream's tag naming is too irregular to match reliably.
gitea_mirror_assets:
  - owner: derailed
    repo: k9s
    match: '^v\d+\.\d+\.\d+$'
    strip: '^$'
    files:
      - checksums.sha256
      - k9s_Linux_amd64.tar.gz
  - owner: kubernetes-sigs
    repo: metrics-server
    match: '^v\d+\.\d+\.\d+$'
    strip: '^$'
    files:
      - components.yaml
  # AzerothCore client data. Pinned, not latest: upstream tags are irregular
  # (v20.0 and a bare v20 both exist, and the release hangs off v20.0), and the
  # point is to preserve known-good artifacts rather than track a moving target.
  # v19 is what pantheon-of-order actually runs — identified by matching the
  # on-disk /home/azeroth/Data.zip byte size (1196494269) against the release
  # assets, whose sizes are unique per version. v20.0 is kept for a future
  # upgrade. Digests are upstream's own published SHA-256s.
  - owner: wowgaming
    repo: client-data
    version: v19
    files:
      - Data.zip
    checksums:
      Data.zip: sha256:d37f19cbf3d1c57d965882340519e0275e0964554476117791ad06069a667b04
  - owner: wowgaming
    repo: client-data
    version: v20.0
    files:
      - Data.zip
    checksums:
      Data.zip: sha256:a3d4df635ae6c2c8f08052c32a79e0f806955150ad36b014a823dd08a32a4610
