---
# Create/maintain pull mirrors of upstream GitHub repos in the local Gitea.
# Idempotent: existing org/repos are left in place; only missing ones are created.
# Requires gitea_token (a Gitea token with org+repo create rights).
#
# The token is sent as the HTTP basic-auth password (url_password), never in
# an Authorization header. The uri module always redacts url_password, even at
# -vvv. Headers are logged in invocation.module_args at high verbosity, and
# Ascender stores those in its job events. Gitea accepts a token as the
# basic-auth password and ignores the username (gitea_basic_auth_user).

- name: Assert Gitea token is available
  ansible.builtin.assert:
    that:
      - gitea_token | length > 0
    fail_msg: >-
      gitea_token is empty. In Ascender, attach the "Gitea mirror bot"
      credential to the mirror job template (it injects GITEA_MIRROR_TOKEN).
      Outside Ascender, export GITEA_MIRROR_TOKEN (the token is in OpenBao at
      secret/automation/gitea-mirror-bot) or set vault_gitea_token.

- name: Check whether the mirror org exists
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/orgs/{{ gitea_mirror_org }}"
    method: GET
    url_username: "{{ gitea_basic_auth_user }}"
    url_password: "{{ gitea_token }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _mirror_org

- name: Create the mirror org (public)
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/orgs"
    method: POST
    url_username: "{{ gitea_basic_auth_user }}"
    url_password: "{{ gitea_token }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ gitea_mirror_org }}"
      visibility: public
      description: Pull mirrors of upstream GitHub repos (cluster builds + pantheon-of-order)
    status_code: [201]
  when: _mirror_org.status == 404

- name: Check which mirrors already exist
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/repos/{{ gitea_mirror_org }}/{{ item.name | default(item.repo) }}"
    method: GET
    url_username: "{{ gitea_basic_auth_user }}"
    url_password: "{{ gitea_token }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _existing_mirrors
  loop: "{{ gitea_mirror_repos }}"
  loop_control:
    label: "{{ item.owner }}/{{ item.repo }}"

- name: Create missing mirrors via the Gitea migrate API
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/repos/migrate"
    method: POST
    url_username: "{{ gitea_basic_auth_user }}"
    url_password: "{{ gitea_token }}"
    force_basic_auth: true
    body_format: json
    body:
      clone_addr: "https://github.com/{{ item.item.owner }}/{{ item.item.repo }}.git"
      repo_owner: "{{ gitea_mirror_org }}"
      repo_name: "{{ item.item.name | default(item.item.repo) }}"
      service: github
      mirror: true
      releases: true
      wiki: false
      lfs: false
      private: false
      mirror_interval: "{{ gitea_mirror_interval }}"
      auth_token: "{{ gitea_mirror_github_token }}"
    # 201 created; 409 conflict if a race recreated it between check and create.
    # 403 "not owner of organization": Gitea's migrate API requires an org
    # OWNER, and the Ascender token (svc-gitea-mirror) is deliberately only in
    # a write team, so it cannot delete the preservation mirrors or packages.
    # That one 403 is reported at the end of the role instead of failing, so
    # syncs and release-asset republishing still run. Any other error fails.
    status_code: [201, 403, 409]
    # Migration clones the repo synchronously; give it room on large repos.
    timeout: "{{ gitea_mirror_migrate_timeout }}"
  register: _created_mirrors
  failed_when: >-
    _created_mirrors.status | default(-1) not in [201, 403, 409]
    or (_created_mirrors.status == 403
        and 'not owner of organization' not in (_created_mirrors.json.message | default('')))
  loop: "{{ _existing_mirrors.results }}"
  loop_control:
    label: "{{ item.item.owner }}/{{ item.item.repo }}"
  when: item.status == 404

- name: Record mirrors that could not be created (token is not an org owner)
  ansible.builtin.set_fact:
    _uncreated_mirrors: >-
      {{
        _created_mirrors.results
        | selectattr('status', 'defined')
        | selectattr('status', 'equalto', 403)
        | map(attribute='item.item')
        | list
      }}

- name: Trigger an immediate mirror sync
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/repos/{{ gitea_mirror_org }}/{{ item.name | default(item.repo) }}/mirror-sync"
    method: POST
    url_username: "{{ gitea_basic_auth_user }}"
    url_password: "{{ gitea_token }}"
    force_basic_auth: true
    status_code: [200]
  loop: "{{ gitea_mirror_repos }}"
  loop_control:
    label: "{{ item.name | default(item.repo) }}"
  when:
    - gitea_mirror_sync_now | bool
    - item not in _uncreated_mirrors

- name: Show mirror org URL
  ansible.builtin.debug:
    msg: "Mirrors ensured under {{ gitea_url }}/{{ gitea_mirror_org }} ({{ gitea_mirror_repos | length }} repos)"

# ---------------------------------------------------------------------------
# Republish release-only assets (k9s binary, metrics-server components.yaml)
# into Gitea generic packages. Gitea mirrors git data + tags but not release
# assets, so these files are fetched from GitHub here (server-side, daily) and
# served to the build from Gitea. See gitea_mirror_assets in defaults/main.yml.
# ---------------------------------------------------------------------------
- name: Resolve latest tag for each release-asset repo
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/repos/{{ gitea_mirror_org }}/{{ item.name | default(item.repo) }}/tags?limit=100"
    url_username: "{{ gitea_basic_auth_user }}"
    url_password: "{{ gitea_token }}"
    force_basic_auth: true
    return_content: true
  register: _asset_tags
  loop: "{{ gitea_mirror_assets }}"
  loop_control:
    label: "{{ item.repo }}"
  # Specs that pin `version:` do not need tag discovery, but this still runs for
  # them so _asset_tags.results stays index-aligned with gitea_mirror_assets for
  # the zip() below. The response is simply ignored downstream.
  when: gitea_mirror_assets | length > 0

- name: Attach resolved version to each release-asset spec
  ansible.builtin.set_fact:
    # A spec may pin `version:` instead of resolving the latest matching tag.
    # This uses an inline `if` rather than `| default()` because Jinja evaluates
    # inline-if lazily — the tag-resolution expression below must not run for a
    # pinned spec, whose `match`/`strip` keys are absent.
    _asset_specs: >-
      {{
        _asset_specs | default([]) + [
          item.0 | combine({
            'version': (
              item.0.version if item.0.version is defined else (
                item.1.json
                | map(attribute='name')
                | select('match', item.0.match)
                | map('regex_replace', item.0.strip, '')
                | community.general.version_sort
                | last
              )
            )
          })
        ]
      }}
  loop: "{{ gitea_mirror_assets | zip(_asset_tags.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.repo }}"
  when: gitea_mirror_assets | length > 0

- name: Check which release assets already exist in Gitea packages
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/packages/{{ gitea_mirror_org }}/generic/{{ item.0.repo }}/{{ item.0.version }}/{{ item.1 }}"
    method: HEAD
    status_code: [200, 404]
  register: _asset_present
  loop: "{{ _asset_specs | default([]) | subelements('files') }}"
  loop_control:
    label: "{{ item.0.repo }}/{{ item.0.version }}/{{ item.1 }}"

- name: Stage and republish missing release assets
  when: _asset_present is defined
  block:
    - name: Ensure the asset staging directory exists
      ansible.builtin.file:
        path: "{{ gitea_mirror_asset_tmp }}"
        state: directory
        mode: "0700"

    - name: Download missing release assets from GitHub
      ansible.builtin.get_url:
        url: "https://github.com/{{ item.item.0.owner }}/{{ item.item.0.repo }}/releases/download/{{ item.item.0.version }}/{{ item.item.1 }}"
        dest: "{{ gitea_mirror_asset_tmp }}/{{ item.item.0.repo }}-{{ item.item.0.version }}-{{ item.item.1 }}"
        # Verified against the spec's published digest when one is given, so a
        # truncated or tampered download fails here instead of being republished.
        checksum: "{{ item.item.0.checksums[item.item.1] | default(omit) }}"
        mode: "0600"
        force: true
      register: _asset_dl
      until: _asset_dl is success
      retries: 5
      delay: 10
      loop: "{{ _asset_present.results }}"
      loop_control:
        label: "{{ item.item.0.repo }}/{{ item.item.0.version }}/{{ item.item.1 }}"
      when: item.status == 404

    - name: Republish missing release assets to Gitea generic packages
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/packages/{{ gitea_mirror_org }}/generic/{{ item.item.0.repo }}/{{ item.item.0.version }}/{{ item.item.1 }}"
        method: PUT
        url_username: "{{ gitea_basic_auth_user }}"
        url_password: "{{ gitea_token }}"
        force_basic_auth: true
        headers:
          Content-Type: application/octet-stream
        src: "{{ gitea_mirror_asset_tmp }}/{{ item.item.0.repo }}-{{ item.item.0.version }}-{{ item.item.1 }}"
        remote_src: true
        status_code: [201, 409]
      loop: "{{ _asset_present.results }}"
      loop_control:
        label: "{{ item.item.0.repo }}/{{ item.item.0.version }}/{{ item.item.1 }}"
      when: item.status == 404

  always:
    # Staged assets are large (Data.zip is ~1.11 GiB), so they must not survive a
    # failed upload.
    - name: Clean up staged asset files
      ansible.builtin.file:
        path: "{{ gitea_mirror_asset_tmp }}/{{ item.item.0.repo }}-{{ item.item.0.version }}-{{ item.item.1 }}"
        state: absent
      loop: "{{ _asset_present.results }}"
      loop_control:
        label: "{{ item.item.0.repo }}/{{ item.item.0.version }}/{{ item.item.1 }}"
      when: item.status == 404

- name: Report mirrors that still need creating by an org owner
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _uncreated_mirrors | length }} declared mirror(s) do not exist
      and could not be created, because Gitea's migrate API requires an owner
      of the {{ gitea_mirror_org }} org and this token (svc-gitea-mirror) is
      deliberately not one: {{ _uncreated_mirrors | map(attribute='repo') | join(', ') }}.
      Create them once as an org owner, either by running this playbook with
      an owner's token in GITEA_MIRROR_TOKEN or through Gitea's
      New Migration page. Later runs will then sync them.
  when: _uncreated_mirrors | length > 0
