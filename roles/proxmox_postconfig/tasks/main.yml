---
- name: Build Proxmox auth header
  ansible.builtin.set_fact:
    _auth: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_id }}={{ proxmox_api_token }}"
  no_log: "{{ 'debug' not in ansible_run_tags }}"

# Cluster-wide, not per node: VMs are spread across proxmox_placement_nodes
# and may be migrated later, so the node is looked up rather than assumed.
- name: Get full VM list from the Proxmox cluster
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Authorization: "{{ _auth }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    return_content: true
  register: proxmox_vm_list
  delegate_to: localhost

- name: Resolve short hostname (strip domain suffix)
  ansible.builtin.set_fact:
    short_hostname: "{{ inventory_hostname | regex_replace('\\..*$', '') }}"

- name: Find VM entry matching this host
  ansible.builtin.set_fact:
    vm_info: >-
      {{
        proxmox_vm_list.json.data
        | selectattr('type', 'equalto', 'qemu')
        | selectattr('name', 'defined')
        | selectattr('name', 'search', short_hostname)
        | list
        | first
      }}

- name: Fail clearly if VM not found in Proxmox
  ansible.builtin.fail:
    msg: >
      Could not find a VM anywhere in the Proxmox cluster whose name
      contains '{{ short_hostname }}'. Verify the VM exists.
  when: vm_info is not defined or vm_info | length == 0

- name: Set VMID, node, current name and node-scoped base URL as facts
  ansible.builtin.set_fact:
    vmid: "{{ vm_info.vmid }}"
    vm_node: "{{ vm_info.node }}"
    vm_current_name: "{{ vm_info.name }}"
    _base: "https://{{ proxmox_host }}/api2/json/nodes/{{ vm_info.node }}"

- name: Display discovered VM
  ansible.builtin.debug:
    msg: "Matched '{{ inventory_hostname }}' → '{{ vm_current_name }}' (VMID {{ vmid }}, node {{ vm_node }})"

- name: Send ACPI shutdown signal
  # forceStop: 1 — fall back to a hard stop if the guest doesn't ACPI-shut-down
  # within shutdown_timeout. Image-mode (bootc) nodes occasionally don't honour
  # the ACPI power event in time, and this is a fresh, pre-cluster node that is
  # about to be reconfigured and restarted, so forcing the stop is safe and keeps
  # provisioning from hanging.
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/status/shutdown"
    method: POST
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      forceStop: 1
      timeout: "{{ shutdown_timeout }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost

- name: Wait for VM to reach stopped state
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/status/current"
    method: GET
    headers:
      Authorization: "{{ _auth }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    return_content: true
  register: vm_status
  until: vm_status.json.data.status == 'stopped'
  # Outlast the graceful window: the forceStop only lands after shutdown_timeout,
  # so poll for shutdown_timeout + a margin for the hard stop to complete.
  retries: "{{ ((shutdown_timeout / 5) | int) + 24 }}"
  delay: 5
  delegate_to: localhost

# Foreman's compute profile now creates efidisk0 (Secure Boot keys pre-enrolled)
# and rng0 together with the VM (foreman-bootc foreman/setup_proxmox_firmware.rb):
# an efidisk moves the VM onto Proxmox's current 4M OVMF, which disables PXE for
# guests without a random number generator, and x86-64-v3 has no RDRAND. This
# play cold-cycles the VM anyway (hotplug/NUMA/cores), so it adds either device
# only if the profile did not, and warns, because a VM that PXE-installed
# without them came from a profile missing that setup. Read the VM's own config:
# /cluster/resources carries no config keys, so checking vm_info always said
# "missing" and would have replaced an existing efidisk.
- name: Get the VM's config
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: GET
    headers:
      Authorization: "{{ _auth }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    return_content: true
  register: _vm_config
  delegate_to: localhost

- name: Check for efidisk0 and rng0
  ansible.builtin.set_fact:
    efidisk_exists: "{{ 'efidisk0' in _vm_config.json.data }}"
    rng_exists: "{{ 'rng0' in _vm_config.json.data }}"

- name: Add EFI disk (only if the compute profile did not create one)
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: PUT
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      efidisk0: "{{ efi_storage }}:0,efitype=4m,pre-enrolled-keys=1"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost
  when: not efidisk_exists

- name: Add VirtIO RNG (only if the compute profile did not create one)
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: PUT
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      rng0: "source=/dev/urandom"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost
  when: not rng_exists

- name: Warn that the compute profile is missing its firmware setup
  ansible.builtin.debug:
    msg: >-
      WARNING: VMID {{ vmid }} was created without
      {{ ((['efidisk0'] if not efidisk_exists else []) + (['rng0'] if not rng_exists else [])) | join(' and ') }};
      added here. Run foreman-bootc foreman/setup_proxmox_firmware.rb so its
      Foreman compute profile creates them.
  when: not (efidisk_exists and rng_exists)

- name: Enable CPU and memory hotplug with NUMA
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: PUT
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      hotplug: "cpu,memory"
      numa: 1
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost

- name: Set CPU cores ceiling and initial vCPUs by role
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: PUT
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      cores: "{{ controlplane_max_cores if 'Controlplane' in foreman_hostgroup else worker_max_cores }}"
      vcpus: "{{ controlplane_max_cores if 'Controlplane' in foreman_hostgroup else worker_max_cores }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost

- name: Compute cleaned VM name
  ansible.builtin.set_fact:
    vm_new_name: "{{ vm_current_name | regex_replace('\\.' + vault_domain + '$', '') }}"

- name: Rename VM (strip domain suffix)
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: PUT
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      name: "{{ vm_new_name }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost
  when: vm_new_name != vm_current_name

- name: Skip rename notice (name already clean)
  ansible.builtin.debug:
    msg: "VM name '{{ vm_current_name }}' has no domain suffix — skipping."
  when: vm_new_name == vm_current_name

- name: Resolve tags for control plane nodes
  ansible.builtin.set_fact:
    vm_tags: "{{ controlplane_tags }}"
  when: "'Controlplane' in foreman_hostgroup"

- name: Resolve tags for worker nodes
  ansible.builtin.set_fact:
    vm_tags: "{{ worker_tags }}"
  when: "'Worker' in foreman_hostgroup"

- name: Fail if vm_tags could not be resolved
  ansible.builtin.fail:
    msg: >-
      Could not determine Proxmox tags for '{{ inventory_hostname }}'.
      foreman_hostgroup='{{ foreman_hostgroup }}' did not match
      'Controlplane' or 'Worker'. Check vms.yml hostgroup values.
  when: vm_tags is not defined

- name: Apply tags to VM
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/config"
    method: PUT
    headers:
      Authorization: "{{ _auth }}"
    body_format: form-urlencoded
    body:
      tags: "{{ vm_tags }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost

- name: Display applied tags
  ansible.builtin.debug:
    msg: "Applied tags '{{ vm_tags }}' to '{{ vm_new_name }}' (VMID {{ vmid }})"

- name: Start VM
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/status/start"
    method: POST
    headers:
      Authorization: "{{ _auth }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200]
  delegate_to: localhost

- name: Wait for VM to reach running state
  ansible.builtin.uri:
    url: "{{ _base }}/qemu/{{ vmid }}/status/current"
    method: GET
    headers:
      Authorization: "{{ _auth }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    return_content: true
  register: vm_started
  until: vm_started.json.data.status == 'running'
  retries: "{{ (startup_timeout / 5) | int }}"
  delay: 5
  delegate_to: localhost

- name: Summary
  ansible.builtin.debug:
    msg: >
      VMID {{ vmid }} | Name: {{ vm_new_name }} | Tags: {{ vm_tags }}
      | efidisk0: {{ 'from profile' if efidisk_exists else 'added (' + efi_storage + ', 4m, pre-enrolled)' }}
      | rng0: {{ 'from profile' if rng_exists else 'added' }} | Hotplug: cpu,memory | NUMA: enabled
      | cores/vcpus: {{ controlplane_max_cores if 'Controlplane' in foreman_hostgroup else worker_max_cores }}
      | Status: running
