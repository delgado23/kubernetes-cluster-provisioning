---
- name: Install metrics-server
  # components.yaml is a release-only asset (not in the git tree), so the mirror
  # playbook republishes it to Gitea's generic package registry.
  ansible.builtin.command:
    cmd: kubectl apply -f {{ mirror_pkg_base }}/metrics-server/{{ metrics_server_version }}/components.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: metrics_server_output
  changed_when: true

- name: Print metrics-server install output
  ansible.builtin.debug:
    var: metrics_server_output.stdout_lines

- name: Wait for metrics-server to be ready
  ansible.builtin.command:
    cmd: >
      kubectl wait --for=condition=Available deployment/metrics-server
      --namespace kube-system
      --timeout=120s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
