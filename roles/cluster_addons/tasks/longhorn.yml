---
- name: Add Longhorn Helm repo
  ansible.builtin.command:
    cmd: /usr/local/bin/helm repo add longhorn https://charts.longhorn.io
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
  failed_when: false

- name: Update Helm repos
  ansible.builtin.command:
    cmd: /usr/local/bin/helm repo update
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Create Longhorn manifest directory
  ansible.builtin.file:
    path: "{{ k8s_manifests_dir }}/longhorn"
    state: directory
    mode: '0700'

- name: Write Longhorn Helm values
  ansible.builtin.copy:
    dest: "{{ k8s_manifests_dir }}/longhorn/values.yml"
    mode: "0600"
    content: |
      defaultSettings:
        defaultDataPath: /var/lib/longhorn
      {% if longhorn_backup_target | length > 0 %}

      defaultBackupStore:
        backupTarget: "{{ longhorn_backup_target }}"
        pollInterval: 300
      {% endif %}

      longhornManager:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

      longhornDriver:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

      longhornUI:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

# CIS C-01: the Longhorn chart binds the support-bundle SA to cluster-admin.
# A Helm post-renderer rewrites that binding to a least-privilege read-only role
# before anything reaches the API server, so Helm itself owns the restricted
# binding. (Patching the live object after install instead broke every chart
# upgrade: Helm tried to move the binding's immutable roleRef back to
# cluster-admin, and the SA held cluster-admin for the whole --wait window.)
- name: Write Longhorn support-bundle restricted ClusterRole manifest
  ansible.builtin.copy:
    dest: "{{ k8s_manifests_dir }}/longhorn/support-bundle-clusterrole.yml"
    mode: "0600"
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: longhorn-support-bundle
        labels:
          app.kubernetes.io/name: longhorn
      rules:
      - apiGroups: [""]
        resources:
          - configmaps
          - endpoints
          - events
          - limitranges
          - namespaces
          - nodes
          - persistentvolumeclaims
          - persistentvolumes
          - pods
          - pods/log
          - resourcequotas
          - serviceaccounts
          - services
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["batch"]
        resources: ["cronjobs", "jobs"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["ingresses", "networkpolicies"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["policy"]
        resources: ["poddisruptionbudgets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["clusterrolebindings", "clusterroles", "rolebindings", "roles"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["csidrivers", "csinodes", "csistoragecapacities", "storageclasses", "volumeattachments"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["longhorn.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

- name: Write Longhorn Helm post-renderer (CIS C-01)
  ansible.builtin.copy:
    dest: "{{ k8s_manifests_dir }}/longhorn/postrender.py"
    mode: "0700"
    content: |
      #!/usr/bin/python3
      """Helm post-renderer for Longhorn (CIS C-01).

      Points the chart's longhorn-support-bundle ClusterRoleBinding at the
      restricted ClusterRole in support-bundle-clusterrole.yml (appended to the
      release) instead of cluster-admin. Every other document passes through
      byte-for-byte: re-serialising the whole chart through YAML 1.1 could turn
      unquoted values such as on/no into booleans.
      """
      import os
      import re
      import sys

      import yaml

      NAME = "longhorn-support-bundle"
      HERE = os.path.dirname(os.path.abspath(__file__))

      def main():
          docs = re.split(r"(?m)^---[ \t]*$", sys.stdin.read())
          out, rewritten, have_role = [], 0, False
          for text in docs:
              try:
                  obj = yaml.safe_load(text)
              except yaml.YAMLError:
                  obj = None
              if isinstance(obj, dict):
                  kind = obj.get("kind")
                  name = (obj.get("metadata") or {}).get("name")
                  if kind == "ClusterRoleBinding" and name == NAME:
                      obj["roleRef"] = {
                          "apiGroup": "rbac.authorization.k8s.io",
                          "kind": "ClusterRole",
                          "name": NAME,
                      }
                      text = "\n" + yaml.safe_dump(obj, sort_keys=False)
                      rewritten += 1
                  elif kind == "ClusterRole" and name == NAME:
                      have_role = True
                  if kind in ("ClusterRoleBinding", "RoleBinding") and \
                          (obj.get("roleRef") or {}).get("name") == "cluster-admin" and \
                          any(s.get("name") == NAME for s in obj.get("subjects") or []):
                      sys.exit("postrender: %s would still bind %s to cluster-admin" % (name, NAME))
              out.append(text)
          if rewritten != 1:
              sys.exit("postrender: expected 1 %s ClusterRoleBinding, found %d; "
                       "the chart changed, review CIS C-01" % (NAME, rewritten))
          if not have_role:
              with open(os.path.join(HERE, "support-bundle-clusterrole.yml")) as f:
                  out.append("\n" + f.read())
          sys.stdout.write("---".join(out))

      main()

- name: Install or upgrade Longhorn via Helm
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/helm upgrade --install longhorn longhorn/longhorn
      --namespace {{ longhorn_namespace }}
      --create-namespace
      --version {{ longhorn_version }}
      --values {{ k8s_manifests_dir }}/longhorn/values.yml
      --post-renderer {{ k8s_manifests_dir }}/longhorn/postrender.py
      --wait
      --timeout 10m
  environment:
    KUBECONFIG: /root/.kube/config
  register: longhorn_helm_output
  until: longhorn_helm_output.rc == 0
  retries: 3
  delay: 30
  changed_when: true

- name: Print Longhorn Helm output
  ansible.builtin.debug:
    var: longhorn_helm_output.stdout_lines

- name: Wait for Longhorn manager DaemonSet to be ready
  ansible.builtin.command:
    cmd: >
      kubectl rollout status daemonset/longhorn-manager
      --namespace {{ longhorn_namespace }}
      --timeout=300s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Read the live longhorn-support-bundle ClusterRoleBinding
  ansible.builtin.command:
    cmd: kubectl get clusterrolebinding longhorn-support-bundle -o jsonpath={.roleRef.name}
  environment:
    KUBECONFIG: /root/.kube/config
  register: longhorn_sb_roleref
  changed_when: false

- name: Require the restricted support-bundle role (CIS C-01)
  ansible.builtin.assert:
    that: longhorn_sb_roleref.stdout == 'longhorn-support-bundle'
    fail_msg: >-
      longhorn-support-bundle is bound to '{{ longhorn_sb_roleref.stdout }}', not the
      restricted longhorn-support-bundle ClusterRole. Check postrender.py.

- name: Write Longhorn NetworkPolicy manifest
  ansible.builtin.copy:
    dest: "{{ k8s_manifests_dir }}/longhorn/networkpolicy.yml"
    mode: "0600"
    content: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: {{ longhorn_namespace }}
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
      ---
      # Allow all intra-namespace traffic. Longhorn has many inter-component
      # communication paths (manager↔manager, manager↔instance-manager,
      # CSI sidecars↔manager, ui→manager) all within the same namespace.
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-intra-namespace
        namespace: {{ longhorn_namespace }}
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector: {}
      ---
      # kube-apiserver calls the Longhorn admission webhook on port 9502
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-apiserver-webhook
        namespace: {{ longhorn_namespace }}
      spec:
        podSelector:
          matchLabels:
            longhorn.io/admission-webhook: longhorn-admission-webhook
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - port: 9502
                protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-traefik-ingress
        namespace: {{ longhorn_namespace }}
      spec:
        podSelector:
          matchLabels:
            app: longhorn-ui
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: {{ traefik_namespace }}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
            ports:
              - port: 8000
                protocol: TCP

- name: Apply Longhorn NetworkPolicy
  ansible.builtin.command:
    cmd: kubectl apply -f {{ k8s_manifests_dir }}/longhorn/networkpolicy.yml
  environment:
    KUBECONFIG: /root/.kube/config
  register: longhorn_netpol_output
  changed_when: true

- name: Print Longhorn NetworkPolicy apply output
  ansible.builtin.debug:
    var: longhorn_netpol_output.stdout_lines

# --- Off-cluster backups (prod only; see defaults/main.yml) -----------------
# The Helm value only seeds the BackupTarget on install; patching the CR keeps
# an existing cluster in step with longhorn_backup_target too.
- name: Point Longhorn's default BackupTarget at the NFS export
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ longhorn_namespace }} patch backuptargets.longhorn.io default
      --type merge -p {{ {'spec': {'backupTargetURL': longhorn_backup_target, 'pollInterval': '5m0s'}} | to_json | quote }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: longhorn_backup_target_patch
  changed_when: "'no change' not in longhorn_backup_target_patch.stdout"
  when: longhorn_backup_target | length > 0

- name: Wait for the BackupTarget to become available
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ longhorn_namespace }} get backuptargets.longhorn.io default
      -o jsonpath={.status.available}
  environment:
    KUBECONFIG: /root/.kube/config
  register: longhorn_backup_target_status
  until: longhorn_backup_target_status.stdout == 'true'
  retries: 20
  delay: 15
  changed_when: false
  when: longhorn_backup_target | length > 0

# Group "default" covers every volume without its own recurring-job labels.
# k8s_upgrade's preflight also triggers this job on demand before an upgrade.
- name: Write the nightly Longhorn backup RecurringJob
  ansible.builtin.copy:
    dest: "{{ k8s_manifests_dir }}/longhorn/recurringjob-backup.yml"
    mode: "0600"
    content: |
      apiVersion: longhorn.io/v1beta2
      kind: RecurringJob
      metadata:
        name: backup-daily
        namespace: {{ longhorn_namespace }}
      spec:
        name: backup-daily
        task: backup
        cron: "{{ longhorn_backup_cron }}"
        retain: {{ longhorn_backup_retain }}
        concurrency: 1
        groups:
          - default
        labels: {}
  when: longhorn_backup_target | length > 0

- name: Apply the nightly Longhorn backup RecurringJob
  ansible.builtin.command:
    cmd: kubectl apply -f {{ k8s_manifests_dir }}/longhorn/recurringjob-backup.yml
  environment:
    KUBECONFIG: /root/.kube/config
  register: longhorn_recurringjob_output
  changed_when: "'unchanged' not in longhorn_recurringjob_output.stdout"
  when: longhorn_backup_target | length > 0
