---
# Resolve addon versions from the local Gitea mirrors (github-mirror org) rather
# than api.github.com. GitHub's release API throttles unauthenticated callers
# (60 req/hr) and serves transient 504s that abort whole builds; the mirrors are
# local and reliable. We read git *tags* (always synced on a Gitea pull mirror,
# unlike releases, which Gitea does not import) and pick the highest *stable*
# semver matching each repo's tag pattern -- "highest", not "newest", because
# upstreams publish backport patch releases to older minors out of version order.
#
# Mirrors are created/refreshed by mirror-github-repos.yml. See vars/gitea.yml.

- name: Define addon version specs (mirror repo, tag pattern, prefix to strip)
  ansible.builtin.set_fact:
    _addon_version_specs:
      # strip '^$' is a no-op (matches only the empty string) -> keep the tag,
      # including its leading 'v', where downstream needs the exact git ref / tag.
      - {var: flannel_version,        repo: flannel,                match: '^v\d+\.\d+\.\d+$',                strip: '^$'}
      - {var: longhorn_version,       repo: longhorn,               match: '^v\d+\.\d+\.\d+$',                strip: '^v'}
      - {var: traefik_chart_version,  repo: traefik-helm-chart,     match: '^v\d+\.\d+\.\d+$',                strip: '^v'}
      - {var: cert_manager_version,   repo: cert-manager,           match: '^v\d+\.\d+\.\d+$',                strip: '^$'}
      - {var: headlamp_version,       repo: headlamp,               match: '^v\d+\.\d+\.\d+$',                strip: '^v'}
      - {var: reflector_version,      repo: kubernetes-reflector,   match: '^v\d+\.\d+\.\d+$',                strip: '^v'}
      - {var: argocd_version,         repo: argo-helm,              match: '^argo-cd-\d',                     strip: '^argo-cd-'}
      - {var: descheduler_version,    repo: descheduler,            match: '^v\d+\.\d+\.\d+$',                strip: '^v'}
      - {var: prometheus_version,     repo: helm-charts,            match: '^kube-prometheus-stack-\d',       strip: '^kube-prometheus-stack-'}
      - {var: kube_router_version,    repo: kube-router,            match: '^v\d+\.\d+\.\d+$',                strip: '^$'}
      - {var: metallb_version,        repo: metallb,                match: '^v\d+\.\d+\.\d+$',                strip: '^$'}
      - {var: metrics_server_version, repo: metrics-server,         match: '^v\d+\.\d+\.\d+$',                strip: '^$'}

- name: Fetch tags for each addon from the Gitea mirror
  ansible.builtin.uri:
    url: "{{ mirror_api_base }}/{{ gitea_mirror_org }}/{{ item.repo }}/tags?limit=100"
    return_content: true
  register: _addon_tags
  until: _addon_tags.status == 200
  retries: 8
  delay: 15
  loop: "{{ _addon_version_specs }}"
  loop_control:
    label: "{{ item.repo }}"

- name: Resolve highest stable version per addon
  ansible.builtin.set_fact:
    _resolved_versions: >-
      {{
        _resolved_versions | default({}) | combine({
          item.0.var: (
            item.1.json
            | map(attribute='name')
            | select('match', item.0.match)
            | map('regex_replace', item.0.strip, '')
            | community.general.version_sort
            | last
          )
        })
      }}
  loop: "{{ _addon_version_specs | zip(_addon_tags.results) | list }}"
  loop_control:
    label: "{{ item.0.var }}"

- name: Set resolved addon versions
  ansible.builtin.set_fact:
    flannel_version:        "{{ _resolved_versions.flannel_version }}"
    longhorn_version:       "{{ _resolved_versions.longhorn_version }}"
    traefik_chart_version:  "{{ _resolved_versions.traefik_chart_version }}"
    cert_manager_version:   "{{ _resolved_versions.cert_manager_version }}"
    headlamp_version:       "{{ _resolved_versions.headlamp_version }}"
    reflector_version:      "{{ _resolved_versions.reflector_version }}"
    # Honor argocd_version_pin (defaults/main.yml) when set; otherwise track the
    # latest argo-cd chart release. Empty/undefined pin falls through to latest.
    argocd_version:         "{{ argocd_version_pin | default('', true) or _resolved_versions.argocd_version }}"
    descheduler_version:    "{{ _resolved_versions.descheduler_version }}"
    prometheus_version:     "{{ _resolved_versions.prometheus_version }}"
    kube_router_version:    "{{ _resolved_versions.kube_router_version }}"
    metallb_version:        "{{ _resolved_versions.metallb_version }}"
    metrics_server_version: "{{ _resolved_versions.metrics_server_version }}"

- name: Display resolved addon versions
  ansible.builtin.debug:
    msg:
      - "Flannel:        {{ flannel_version }}"
      - "Longhorn:       {{ longhorn_version }}"
      - "Traefik chart:  {{ traefik_chart_version }}"
      - "cert-manager:   {{ cert_manager_version }}"
      - "Headlamp:       {{ headlamp_version }}"
      - "Reflector:      {{ reflector_version }}"
      - "ArgoCD:         {{ argocd_version }}"
      - "Descheduler:    {{ descheduler_version }}"
      - "Prometheus:     {{ prometheus_version }}"
      - "kube-router:    {{ kube_router_version }}"
      - "MetalLB:        {{ metallb_version }}"
      - "metrics-server: {{ metrics_server_version }}"
