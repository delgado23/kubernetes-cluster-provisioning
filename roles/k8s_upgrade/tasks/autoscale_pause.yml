---
# The autoscalers add/remove/resize nodes; doing that mid-roll (or during a
# rollback) is how the 1.36 test rehearsal grew an unplanned worker-04.
- name: Load Ascender credentials
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop: ["{{ playbook_dir }}/vars/vault.yml", "{{ playbook_dir }}/vars/awx.yml"]
  when: k8s_upgrade_manage_autoscale | bool

- name: Find this cluster's autoscale schedules
  ansible.builtin.uri:
    url: "{{ awx_url }}/api/v2/schedules/?name__icontains=autoscale&page_size=50"
    headers:
      Authorization: "Bearer {{ awx_token }}"
    return_content: true
  register: _k8s_schedules
  when: k8s_upgrade_manage_autoscale | bool

- name: Remember which of them are enabled
  ansible.builtin.set_fact:
    # Whole-word match on the schedule name ("Autoscale prod every ...").
    k8s_paused_schedules: >-
      {%- set out = [] -%}
      {%- for sch in (_k8s_schedules.json.results | default([])) | selectattr('enabled') -%}
        {%- if cluster_env in sch.name.lower().split() -%}{%- set _ = out.append(sch.id) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Pause them for the upgrade
  ansible.builtin.uri:
    url: "{{ awx_url }}/api/v2/schedules/{{ item }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ awx_token }}"
    body_format: json
    body:
      enabled: false
  loop: "{{ k8s_paused_schedules }}"

- name: Autoscaling paused
  ansible.builtin.debug:
    msg: >-
      {{ 'Paused autoscale schedules ' ~ (k8s_paused_schedules | join(', ')) ~ ' for ' ~ cluster_env
         ~ '; re-enabled only after a successful postflight.'
         if k8s_upgrade_manage_autoscale | bool else 'Autoscale schedules not managed (k8s_upgrade_manage_autoscale=false).' }}
