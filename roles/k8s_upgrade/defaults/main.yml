---
# Rolling Kubernetes upgrade for image-mode (bootc) clusters. See upgrade.yml.
#
# Required (extra vars / Ascender survey):
#   cluster_env          test | prod -- no default on purpose
#   k8s_target_version   e.g. 1.36.5 (one minor above the running control
#                        plane, or a later patch of the same minor)

# Node image tag to switch to; foreman-bootc tags images with the k8s version.
k8s_image_tag: "{{ k8s_target_version }}"

# Root-only backups on each node. /var is persistent and outside the bootc
# deployment, so the backups survive both the switch and a rollback. The etcd
# snapshot is copied to every control plane; nightly vzdump -> PBS takes them
# off-cluster. They contain the cluster CA and encryption config: 0700/0600.
k8s_upgrade_backup_dir: /var/lib/k8s-upgrade-backups

k8s_upgrade_min_sysroot_free_gb: 5     # staged image + ostree objects
k8s_upgrade_cert_min_days: 7           # refuse to start with certs this close to expiry
k8s_upgrade_allow_cordoned: false
# After each node is back and uncordoned: pause this long, then wait (up to
# settle_retries x 15s) for no Pending pods, every workload available and every
# Longhorn volume healthy before the next node is drained.
k8s_upgrade_settle_seconds: 60
k8s_upgrade_settle_retries: 40      # a cordoned node normally means a previous run stopped there

# HTTPS endpoints that must answer at every gate (after the first control
# plane, after the first worker, and at the end). Status 200-399 or 401.
# Test clusters get none by default: they use Let's Encrypt *staging* certs and
# their *.k8s-test wildcard isn't necessarily in public DNS.
k8s_upgrade_smoke_urls: >-
  {{ ['https://headlamp.k8s.garaventaville.com/'] if cluster_env == 'prod' else [] }}
k8s_upgrade_smoke_validate_certs: "{{ cluster_env == 'prod' }}"

# Pause this cluster's autoscale schedules for the run (needs vars/vault.yml,
# i.e. the Ascender vault credential); false for CLI runs without the vault.
k8s_upgrade_manage_autoscale: true

# Off-cluster Longhorn backup before any node changes (tasks/longhorn_backup.yml).
# Mandatory on prod; elsewhere it runs only if the cluster has a backup target.
k8s_upgrade_require_backup: "{{ cluster_env == 'prod' }}"
k8s_upgrade_backup_recurringjob: backup-daily     # created by cluster_addons
k8s_upgrade_backup_retries: 80                    # x 15s = 20 min

