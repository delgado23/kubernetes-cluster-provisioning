---
# vars/foreman.yml
# Foreman connection and resource identifiers.

foreman_url: "{{ vault_foreman_url }}"
foreman_user: "{{ vault_foreman_user }}"
foreman_password: "{{ vault_foreman_password }}"
foreman_validate_certs: true
foreman_domain: "{{ vault_domain }}"

# Location and Organization — required by Foreman on every host
# Find with: curl -sk -u admin:pass <foreman_url>/api/locations | python3 -m json.tool
# Find with: curl -sk -u admin:pass <foreman_url>/api/organizations | python3 -m json.tool
foreman_location_id: 3
foreman_organization_id: 4

# Proxmox compute resource registered in Foreman
# Find with: curl -sk -u admin:pass <foreman_url>/api/compute_resources | python3 -m json.tool
foreman_compute_resource_id: 1

# Compute profile (maps to a Proxmox VM sizing template)
# Find with: curl -sk -u admin:pass <foreman_url>/api/compute_profiles | python3 -m json.tool
#foreman_compute_profile_id: 6
foreman_compute_profile_controlplane: 8   # Kubernetes Controlplane Node
foreman_compute_profile_worker: 6         # Kubernetes Worker Node

# Proxmox nodes that new cluster VMs are spread across, round-robin by the
# number in the VM name: k8s-cp-02 lands on the 2nd entry, k8s-worker-04 wraps
# back to the 1st. This keeps the control planes on separate hosts, so losing
# one node doesn't take etcd quorum with it. Both compute profiles pin
# node_id=pve-01, which used to put every VM on one host; the node_id sent
# per host at create time overrides that.
# Only list nodes that hold LINSTOR replicas of the VM disks. pve-04 is
# excluded (CPU incompatibility breaks live migration). pve-05 has no LINSTOR
# storage pool.
proxmox_placement_nodes:
  - pve-01
  - pve-02
  - pve-03

# Proxmox storage pool for VM disks
proxmox_storage: "linstor"
proxmox_disk_cache: "none"   # none | writeback | writethrough | unsafe

# Build polling (used when wait_for_build: true)
wait_for_build: true
build_wait_retries: 100
build_wait_delay_seconds: 30
